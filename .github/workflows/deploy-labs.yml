name: Deploy HTML labs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "html_labs/**"
      - ".github/workflows/deploy-labs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble the public course site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='html_labs' \
            ./ "$RUNNER_TEMP/site/"
          rsync -a html_labs/ "$RUNNER_TEMP/site/"

      - name: Upload lab workbook
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
